<text x="255" y="275" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" fill="#8a7a6c" text-anchor="middle">Robot 1 picks up a product</text>
<text x="545" y="275" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" fill="#8a7a6c" text-anchor="middle">Robot 2 takes it to an ejector</text>
<text x="940" y="275" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" fill="#8a7a6c" text-anchor="middle">one cell per cycle, limited capacity</text>
<text x="550.0" y="312" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="14" fill="#4a413a" text-anchor="middle">Each move, pick-up or drop-off takes one cycle and must be approved by the coordinator (capacities, collisions).</text>
