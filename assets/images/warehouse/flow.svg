<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330">
<rect width="1100" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a413a"/></marker></defs>
<rect x="380" y="20" width="340" height="62" rx="10" fill="#301c0e"/>
<text x="550" y="50" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f2ede9" text-anchor="middle">Centralisateur (coordinator)</text>
<text x="550" y="72" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" fill="#e2bf98" text-anchor="middle">approves or refuses every action</text>
<rect x="40" y="160" width="140" height="80" rx="8" fill="#8dd3c7" stroke="#21201e" stroke-width="1.5"/>
<text x="110.0" y="206" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#21201e" text-anchor="middle">Fixed zone</text>
